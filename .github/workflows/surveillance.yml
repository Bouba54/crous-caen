name: Surveillance CROUS

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (GitHub peut avoir du retard)
  workflow_dispatch:         # permet de lancer à la main depuis l'onglet Actions

permissions:
  contents: write            # pour sauvegarder logements_vus.json

concurrency:
  group: crous
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les logements
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ONCE: "1"
        run: python crous_watch.py

      - name: Sauvegarder la liste des logements vus
        run: |
          if [ -n "$(git status --porcelain logements_vus.json)" ]; then
            git config user.name "crous-bot"
            git config user.email "crous-bot@users.noreply.github.com"
            git add logements_vus.json
            git commit -m "maj logements vus"
            git pull --rebase origin main
            git push
          fi
